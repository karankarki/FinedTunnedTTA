name: credit_story_player
description: Plays a credit story (one MP3 + one animation timeline JSON) like a video, on a fixed canvas that fits every screen.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  http: ^1.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
